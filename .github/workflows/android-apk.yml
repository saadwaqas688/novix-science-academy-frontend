name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Create Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Set version
        working-directory: mobile/android
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KS_B64" || { echo "Missing ANDROID_KEYSTORE_B64 secret"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/novix.p12"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          mkdir -p public/downloads
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/novix.p12" --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias novix \
            --out public/downloads/novix-academy.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs public/downloads/novix-academy.apk | head -3
          SIZE=$(stat -c %s public/downloads/novix-academy.apk)
          printf '{"version":"1.0.%s","sizeBytes":%s,"builtAt":"%s"}\n' "$GITHUB_RUN_NUMBER" "$SIZE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/downloads/app-version.json
          rm -f "$RUNNER_TEMP/novix.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: novix-academy-apk
          path: public/downloads/novix-academy.apk

      - name: Publish APK to the website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/novix-academy.apk public/downloads/app-version.json
          git commit -m "Android app 1.0.${GITHUB_RUN_NUMBER}"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
